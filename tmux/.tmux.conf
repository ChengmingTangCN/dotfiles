# reload config
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded."

# change default prefix
unbind-key C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Virtual terminal exposed to applications
set -s default-terminal "tmux-256color"

set -s set-clipboard on
# Capabilities of outer terminals
set -su terminal-overrides

# True Color
set -as terminal-overrides ',alacritty:Tc'
set -as terminal-overrides ',tmux-256color:Tc'

# OSC 52
set -as terminal-overrides ',alacritty:Ms=\E]52;%p1%s;%p2%s\007'
set -as terminal-overrides ',tmux-256color:Ms=\E]52;%p1%s;%p2%s\007'

# Mouse support
set -g mouse on

# Scrollback history per pane
set -g history-limit 50000

# Vi-style copy mode
setw -g mode-keys vi

# Status bar
set -g status-left-length 40
set -g status-left \
    ' #{?client_prefix,#[bg=yellow#,fg=black],}#h:#S#[default] '
set -g status-right ' %H:%M '

# <prefix> , renames the current window; <prefix> $ renames the session
# both refresh the title
set -g set-titles on
set -g set-titles-string "#h | #S: #W"

# Automatic window naming
setw -g automatic-rename on

# pane traversal
bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R

# Popup (tmux >= 3.2)
if-shell 'tmux list-commands | grep -q "^display-popup "' \
    'bind f display-popup -E -d "#{pane_current_path}" -h 70% -w 70%'

# Extended keys (tmux >= 3.2)
set -sq extended-keys on

